<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>rex-micro scene</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #12151c; --line: #232836; --text: #d6dae3; --dim: #7b8394;
    --working: #3b82f6; --blocked: #f59e0b; --error: #ef4444; --done: #22c55e; --idle: #e8ebf2;
    --layer: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 675px; background: var(--bg); overflow: hidden;
    font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; color: var(--text); }
  body.hero { height: 630px; }
  .stage { position: absolute; inset: 0; display: grid; grid-template-columns: 430px 1fr; gap: 36px; padding: 52px 56px 92px; }
  body.hero .stage { padding: 128px 56px 48px; }
  .glow { position: absolute; width: 560px; height: 560px; left: -60px; top: 60px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,.16), transparent 65%); filter: blur(10px); }
  /* title (hero only) */
  .title { display: none; position: absolute; left: 56px; top: 40px; right: 56px; }
  body.hero .title { display: flex; align-items: baseline; gap: 22px; }
  .title h1 { font-size: 46px; letter-spacing: -1px; font-weight: 700; color: #fff; }
  .title h1 span { color: var(--layer); }
  .title p { font-size: 19px; color: var(--dim); }
  /* pad */
  .pad { align-self: center; justify-self: center; }
  /* rex window */
  .win { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    display: grid; grid-template-rows: 34px 1fr; box-shadow: 0 30px 80px rgba(0,0,0,.5); align-self: center; height: 100%; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #2b303d; display: inline-block; }
  .bar b { margin-left: 10px; font-weight: 500; color: var(--text); }
  .body { display: grid; grid-template-columns: 150px 1fr; min-height: 0; }
  .side { border-right: 1px solid var(--line); padding: 12px 10px; font-size: 12px; }
  .side .h { color: var(--dim); font-size: 10px; letter-spacing: 1px; margin: 4px 6px 8px; }
  .sess { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; margin-bottom: 2px; }
  .sess.on { background: #1b2030; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px; background: var(--line); min-height: 0; }
  .pane { background: var(--panel); padding: 10px 12px; font-size: 11.5px; line-height: 1.55; position: relative; overflow: hidden; }
  .pane.focus { box-shadow: inset 0 0 0 2px var(--layer); }
  .pane .ph { display: flex; justify-content: space-between; color: var(--dim); font-size: 10.5px; margin-bottom: 6px; }
  .pane .ph b { color: var(--text); font-weight: 600; }
  .state { font-size: 10px; padding: 1px 7px; border-radius: 9px; border: 1px solid currentColor; }
  .l { white-space: nowrap; color: #aab1bf; }
  .l.k { color: #fff; }
  .ask { margin-top: 6px; border: 1px solid var(--blocked); border-radius: 6px; padding: 6px 8px; color: #fde7b0; }
  .ask .opt { color: #fff; }
  .ok { color: var(--done); }
  .err { color: #fca5a5; }
  /* caption */
  .cap { position: absolute; left: 56px; right: 56px; bottom: 26px; height: 44px; display: flex; align-items: center; gap: 14px; font-size: 16px; }
  body.hero .cap { display: none; }
  .cap .key { padding: 6px 12px; border-radius: 8px; background: #1b2030; border: 1px solid var(--line); color: #fff; font-weight: 600; font-size: 14px; }
  .cap .txt { color: var(--text); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="title"><h1>rex<span>-</span>micro</h1><p>Your Codex Micro, driving Rex.</p></div>
<div class="stage">
  <svg class="pad" id="pad" width="420" height="440" viewBox="0 0 420 440"></svg>
  <div class="win">
    <div class="bar"><i></i><i></i><i></i><b>Rex</b><span id="wtitle">· agents</span></div>
    <div class="body">
      <div class="side" id="side"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>
<div class="cap" id="cap"></div>
<script>
const C = { working: '#3b82f6', blocked: '#f59e0b', error: '#ef4444', done: '#22c55e', idle: '#e8ebf2', empty: '#2a2f3b' };
const LABEL = { working: 'working', blocked: 'needs you', error: 'error', done: 'done', idle: 'idle' };
const panes = [
  { name: 'api', app: 'claude-code', session: 'api' },
  { name: 'web', app: 'codex', session: 'web' },
  { name: 'docs', app: 'claude-code', session: 'docs' },
  { name: 'infra', app: 'codex', session: 'infra' },
];
// Timeline (seconds). Each entry: [from, states for panes 0-3, focus pane, pressed key, caption key, caption text]
const T = [
  [0.0,  ['working','working','working','working'], -1, null, 'AGENT KEYS', 'Each key follows an agent pane in Rex and shows its state.'],
  [2.2,  ['blocked','working','working','working'], -1, null, 'AGENT KEYS', 'An agent asks for permission. Its key turns amber.'],
  [4.0,  ['blocked','working','working','working'],  0, 'AG0', 'AGENT KEY', 'Press it: Rex jumps to that session and pane.'],
  [6.0,  ['working','working','working','working'],  0, 'APPR', 'APPROVE', 'Answer the prompt without touching the keyboard.'],
  [8.0,  ['working','done','working','working'],     0, null, 'AGENT KEYS', 'Another agent finishes. Green means done.'],
  [9.6,  ['working','idle','working','working'],     1, 'AG1', 'AGENT KEY', 'Jump to it; double-press to zoom.'],
  [11.4, ['working','idle','working','error'],       1, null, 'AGENT KEYS', 'Red means an agent hit an error.'],
  [13.0, ['working','idle','working','error'],       3, 'STICK', 'STICK + DIAL', 'Move between panes and scroll. Everything is one TOML file.'],
];
const DURATION = 15.0;

function frame(t) {
  let cur = T[0];
  for (const e of T) if (t >= e[0]) cur = e;
  return { states: cur[1], focus: cur[2], pressed: (t - cur[0] < 0.45) ? cur[3] : null, capKey: cur[4], cap: cur[5], since: t - cur[0] };
}

function breath(t, speed) { return 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * speed)); }

function keyLook(state, t) {
  if (state === 'empty') return { c: C.empty, a: 1, glow: 0 };
  if (state === 'working') return { c: C.working, a: breath(t, 3.2), glow: 1 };
  if (state === 'blocked' || state === 'error') return { c: C[state], a: breath(t, 6.5), glow: 1 };
  if (state === 'idle') return { c: C.idle, a: 0.35, glow: 0.3 };
  return { c: C[state], a: 1, glow: 1 };
}

function drawPad(t, f) {
  const s = [];
  const agentStates = [...f.states, 'empty', 'empty'];
  s.push(`<defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2e38"/><stop offset="1" stop-color="#1a1d24"/></linearGradient>
    <linearGradient id="keycap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#2c3039"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>`);
  s.push(`<rect x="10" y="10" width="400" height="420" rx="34" fill="url(#body)" stroke="#3a3f4c"/>`);
  s.push(`<rect x="10" y="10" width="400" height="420" rx="34" fill="none" stroke="${'#8b5cf6'}" stroke-opacity=".35" stroke-width="2"/>`);
  const K = 76, G = 18, X0 = 38, Y0 = 38;
  const pos = (col, row) => [X0 + col * (K + G), Y0 + row * (K + G)];
  // row 1: dial, AG, AG, stick
  const [dx, dy] = pos(0, 0);
  const dialAngle = f.capKey === 'STICK + DIAL' ? f.since * 140 : 0;
  s.push(`<circle cx="${dx + K/2}" cy="${dy + K/2}" r="34" fill="#16181e" stroke="#4a505e" stroke-width="2"/>`);
  s.push(`<circle cx="${dx + K/2}" cy="${dy + K/2}" r="26" fill="#23262f"/>`);
  s.push(`<line x1="${dx + K/2}" y1="${dy + K/2 - 22}" x2="${dx + K/2}" y2="${dy + K/2 - 12}" stroke="#9aa1b0" stroke-width="3" stroke-linecap="round" transform="rotate(${dialAngle} ${dx + K/2} ${dy + K/2})"/>`);
  const agentPos = [pos(1, 0), pos(2, 0), pos(0, 1), pos(1, 1), pos(2, 1), pos(3, 1)];
  agentPos.forEach(([x, y], i) => {
    const look = keyLook(agentStates[i], t + i * 0.7);
    const pressed = f.pressed === 'AG' + i;
    const off = pressed ? 3 : 0;
    if (look.glow) s.push(`<rect x="${x + 6}" y="${y + 6}" width="${K - 12}" height="${K - 12}" rx="14" fill="${look.c}" opacity="${0.55 * look.a * look.glow}" filter="url(#blur)"/>`);
    s.push(`<rect x="${x}" y="${y + off}" width="${K}" height="${K}" rx="14" fill="#e9edf5" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".22"/>`);
    s.push(`<rect x="${x + 5}" y="${y + 5 + off}" width="${K - 10}" height="${K - 10}" rx="11" fill="${look.c}" fill-opacity="${0.22 + 0.55 * look.a}"/>`);
  });
  // stick
  const [sx, sy] = pos(3, 0);
  let nx = 0, ny = 0;
  if (f.capKey === 'STICK + DIAL' && f.since < 0.9) { nx = 9; }
  s.push(`<circle cx="${sx + K/2}" cy="${sy + K/2}" r="33" fill="#15171d" stroke="#4a505e" stroke-width="2"/>`);
  s.push(`<circle cx="${sx + K/2 + nx}" cy="${sy + K/2 + ny}" r="20" fill="#2f333d" stroke="#5a6070"/>`);
  // row 3: action keys
  const caps = ['FAST', 'APPR', 'REJ', 'SPLIT'];
  const icons = ['⚡', '✓', '⊘', '⤳'];
  caps.forEach((c, i) => {
    const [x, y] = pos(i, 2);
    const pressed = f.pressed === c;
    const off = pressed ? 3 : 0;
    s.push(`<rect x="${x}" y="${y + off}" width="${K}" height="${K}" rx="14" fill="url(#keycap)" stroke="${pressed ? '#8b5cf6' : '#4a505e'}" stroke-width="${pressed ? 2.5 : 1}"/>`);
    s.push(`<text x="${x + K/2}" y="${y + K/2 - 2 + off}" fill="#e6e9f0" font-size="20" text-anchor="middle">${icons[i]}</text>`);
    s.push(`<text x="${x + K/2}" y="${y + K/2 + 20 + off}" fill="#8f97a6" font-size="10" text-anchor="middle" font-family="inherit">${c}</text>`);
  });
  // row 4: haptic pad, wide MIC, CODEX
  const [hx, hy] = pos(0, 3);
  s.push(`<circle cx="${hx + K/2}" cy="${hy + K/2 - 6}" r="22" fill="#181a20" stroke="#3d4250"/>`);
  [0, 1, 2].forEach(i => s.push(`<circle cx="${hx + K/2 - 12 + i * 12}" cy="${hy + K - 8}" r="2.4" fill="#cfd4dd" opacity="${i === 0 ? 0.9 : 0.25}"/>`));
  const [mx, my] = pos(1, 3);
  s.push(`<rect x="${mx}" y="${my}" width="${2 * K + G}" height="${K}" rx="14" fill="url(#keycap)" stroke="#4a505e"/>`);
  s.push(`<text x="${mx + K + G/2}" y="${my + K/2 + 5}" fill="#8f97a6" font-size="12" text-anchor="middle">MIC</text>`);
  const [cx, cy] = pos(3, 3);
  s.push(`<rect x="${cx}" y="${cy}" width="${K}" height="${K}" rx="14" fill="url(#keycap)" stroke="#4a505e"/>`);
  s.push(`<text x="${cx + K/2}" y="${cy + K/2 + 4}" fill="#8f97a6" font-size="10" text-anchor="middle">CODEX</text>`);
  document.getElementById('pad').innerHTML = s.join('');
}

const lines = {
  api: [['k', '> rate-limit /v1/upload'], ['', '● Reading middleware/limit.ts'], ['', '● Editing routes/upload.ts']],
  web: [['k', '> fix the flaky checkout test'], ['', '● Running pnpm test checkout'], ['', '● 12 passed, 0 failed']],
  docs: [['k', '> document the new CLI flags'], ['', '● Writing docs/cli.md'], ['', '● Checking links']],
  infra: [['k', '> bump the base image to 24.04'], ['', '● Building image'], ['', '● Running smoke tests']],
};

function drawRex(t, f) {
  const side = ['<div class="h">SESSIONS</div>'];
  panes.forEach((p, i) => {
    const st = f.states[i];
    side.push(`<div class="sess ${f.focus === i ? 'on' : ''}"><span class="dot" style="background:${C[st]}"></span>${p.session}</div>`);
  });
  document.getElementById('side').innerHTML = side.join('');
  const grid = panes.map((p, i) => {
    const st = f.states[i];
    const body = lines[p.name].map(([cls, txt], j) => {
      const spin = (st === 'working' && j === 2) ? ' ' + '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏'[Math.floor(t * 10) % 10] : '';
      return `<div class="l ${cls}">${txt}${spin}</div>`;
    }).join('');
    let extra = '';
    if (st === 'blocked') extra = `<div class="ask">Allow edit to routes/upload.ts?<br><span class="opt">❯ 1. Yes</span>&nbsp;&nbsp; 2. No</div>`;
    if (i === 0 && f.capKey === 'APPROVE') extra = `<div class="l ok">✓ Edit approved</div>`;
    if (st === 'done' || (st === 'idle' && i === 1)) extra = `<div class="l ok">✓ Done in 3m 12s</div>`;
    if (st === 'error') extra = `<div class="l err">✕ docker: disk full</div>`;
    return `<div class="pane ${f.focus === i ? 'focus' : ''}"><div class="ph"><b>${p.name} · ${p.app}</b><span class="state" style="color:${C[st]}">${LABEL[st]}</span></div>${body}${extra}</div>`;
  });
  document.getElementById('grid').innerHTML = grid.join('');
  document.getElementById('wtitle').textContent = f.focus >= 0 ? `· ${panes[f.focus].session}` : '· agents';
  document.getElementById('cap').innerHTML = `<span class="key">${f.capKey}</span><span class="txt">${f.cap}</span>`;
}

window.render = (t) => { const f = frame(t % DURATION); drawPad(t, f); drawRex(t, f); };
window.DURATION = DURATION;
const params = new URLSearchParams(location.search);
if (params.get('mode') === 'hero') {
  document.body.classList.add('hero');
  // Hero: a mixed, readable moment.
  const f = { states: ['blocked', 'done', 'working', 'error'], focus: 0, pressed: null, capKey: '', cap: '', since: 1 };
  drawPad(1.2, f); drawRex(1.2, f);
} else if (params.has('t')) {
  render(parseFloat(params.get('t')));
} else {
  const start = performance.now();
  const loop = () => { render((performance.now() - start) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
