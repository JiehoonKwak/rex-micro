name: release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
  release:
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the attestation through Sigstore
      attestations: write # store the build attestation
      artifact-metadata: write # record the attested files
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and sign
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/attest@v4.2.2
        with:
          subject-path: |
            dist/rex-micro_*_darwin_universal.tar.gz
            dist/stage/rex-micro
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # gh creates the release as a draft, uploads every file, then publishes
        # it (so immutability applies to the complete set) and deletes the
        # draft if an upload fails.
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*.tar.gz dist/checksums.txt
      - name: Update Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        if: env.TAP_DEPLOY_KEY != ''
        run: scripts/update-tap.sh "${GITHUB_REF_NAME#v}"
