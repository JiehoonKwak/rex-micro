# rex-micro configuration
#
# Edit, then run `rex-micro doctor` to check it. The daemon reloads on save.
# Reference: https://github.com/JiehoonKwak/rex-micro#configuration

[rex]
app = ""          # Rex app client label or ID; "" picks the Rex app on this Mac
poll = "30s"      # full re-read in case Rex missed an event; also the retry while Rex is down

[agents]
# Which panes the six Agent Keys follow. Like the Rex sidebar, they cover this
# Mac's Rex and every host in `rex hosts`; a host that does not answer is
# skipped until it does.
#   auto     - panes running an agent (Claude Code, Codex, ...), in session order
#   sessions - Rex sessions 1-6 (this Mac's first, then each host's); the key
#              shows the most urgent agent in that session
#   slots    - the panes named in `slots`, by label or block ID (block IDs change
#              when Rex restarts; labels do not)
mode = "auto"
# slots = ["api", "web", "docs"]
# How auto mode orders the agents on the keys:
#   stable   - a key keeps its agent; a new agent takes the first free key
#   priority - like the Rex sidebar's Activity by Priority: blocked, error,
#              working, then done and idle together, the agent that entered its
#              state last first within each; keys move as states change
#   session  - like Activity by Session: session order, then layout order
order = "stable"
press = "show"         # show | show_zoom | none
double = "show_zoom"
always = false         # true: layers cannot rebind AG00-AG05; they always show agents

[lighting]
brightness = 0.8       # 0-1, applied on top of each state's own brightness
backlight = "layer"    # "layer" lights the keys in the active layer's color; "off"

[lighting.states]
# effect: solid | breath | shallow_breath | snake | rainbow | gradient | off
# speed (0-1) applies to animated effects and defaults to 0.4.
working = { color = "#3B82F6", effect = "breath" }
blocked = { color = "#F59E0B", effect = "breath", speed = 0.8 }
error   = { color = "#EF4444", effect = "breath", speed = 0.8 }
done    = { color = "#22C55E" }
idle    = { color = "#FFFFFF", brightness = 0.5 }
empty   = { effect = "off" }

[stick]
threshold = 0.6        # how far to push before a direction fires (0-1)
angle_offset = 0.0     # rotate directions if up comes out as right (-1 to 1 = a full turn)

[timing]
# A press waits double_press only when the key also has a double binding.
double_press = "300ms"
hold = "500ms"

[pad]
# The pad's own layers: its bottom-left touch sensor cycles them and its three
# LEDs show which is on.
#   off  - leave the pad's keymap to Work Louder Input; rex-micro reads only
#          the Codex layer (Layer 1)
#   sync - store one pad layer per [[layer]] below (at most 6): the touch
#          sensor then picks a rex-micro layer, and a layer rex-micro turns on
#          (by match or the dial) shows on the LEDs. The keymap it replaces is
#          saved and written back when you set "off" again. Quit Work Louder
#          Input while this is on: it rewrites the keymap.
layers = "off"

# Layers. The first layer is the base (it cannot have a match): keys a later
# layer leaves out fall through to it. Press the dial to cycle layers (or touch
# the pad's sensor, with [pad] layers = "sync"), or let a layer turn on by
# itself with match:
#   match = { app = "Google Chrome" }   while that app is in front ("Rex" = any Rex)
#   match = { program = "lazygit" }     while that program runs in the Rex pane you see;
#                                       wins over an app match, whatever the order
# A layer you pick by hand stays until you switch apps or the program changes;
# then the matching layer (or the first) comes back.
# A layer that binds an Agent Key lights it in the layer color.
# `rex-micro edit` edits all of this on screen.
#
# Key names:  AG00-AG05 (Agent Keys), ACT06-ACT09, MIC (the wide key), ACT12,
#             ENC_CLK (dial press), ENC_CW / ENC_CC (dial turns),
#             STICK_UP / STICK_DOWN / STICK_LEFT / STICK_RIGHT
#
# A binding does exactly one thing:
#   { action = "pane.zoom" }                     Rex action (`rex-micro actions` lists them,
#   { action = "pane.split", args = { direction = "right" } }   including your init.lua rex.action ones)
#   { key = "enter" }  { key = ["ctrl+c"] }      key presses to the focused pane
#   { key = "y", target = "agent" }              ...or to the selected agent pane (the last
#                                                one shown with an Agent Key, else the most urgent)
#   { shortcut = "cmd+shift+]" }                 a shortcut in the app in front (needs Accessibility);
#   { shortcut = "right_option" }                a lone modifier taps that key (dictation hotkeys);
#   { shortcut = "right_option", held = true }   ...or keeps it down while the pad key is
#   { text = "continue" }                        type text into the selected agent pane
#   { rex = ["run", "--", "lazygit"] }           any rex CLI arguments
#   { shell = "open -a Typeless" }               a shell command; effects run in order, so it
#                                                waits (up to 10s); add detach = true for long ones
#   { builtin = "layer.next" }                   layer.next, layer.prev, layer.<name>, session.<1-9>,
#                                                agent.show, agent.show_zoom, agent.attention, none,
#                                                keys.show (this layer's keys on screen; see below)
# Any binding can add label = "..." to name it on the keys overlay and in the editor:
#   ACT07 = { shortcut = "cmd+shift+a", label = "Tab search" }
# keys.show on a hold shows the keys while the key is held; on a press, for 5
# seconds or until the next pad input. It takes no focus.
# Gestures: give a table per gesture instead of a single binding:
#   MIC = { down = { shell = "..." }, up = { shell = "..." } }   push-to-talk
#   ACT06 = { press = { ... }, double = { ... }, hold = { ... } }

[[layer]]
name = "agents"
color = "#8B5CF6"

[layer.keys]
ACT06 = { action = "pane.zoom" }          # FAST cap: zoom the focused pane
ACT07 = { key = "enter" }                 # APPROVE cap
ACT08 = { key = "escape" }                # REJECT cap
ACT09 = { action = "pane.split.auto" }    # SPLIT cap
MIC   = { builtin = "none" }              # bind your dictation tool here
ACT12 = { key = "enter" }                 # CODEX cap: send
ENC_CLK = { press = { builtin = "layer.next" }, hold = { builtin = "keys.show" } }  # hold: show these keys
ENC_CW  = { key = "page_down" }
ENC_CC  = { key = "page_up" }
STICK_UP    = { action = "pane.focus.up" }
STICK_DOWN  = { action = "pane.focus.down" }
STICK_LEFT  = { action = "pane.focus.left" }
STICK_RIGHT = { action = "pane.focus.right" }

